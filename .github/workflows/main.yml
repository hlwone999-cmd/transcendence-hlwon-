# Build APK Transcendence — Kalkulator Lot XAUUSD (IDR)
# Menjalankan analyze + test, lalu build APK release dan unggah sebagai artifact.
name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.1
          channel: stable
          cache: true

      - name: Pub get
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build APK (release, arm64-only + obfuscate — ukuran ~50% lebih kecil)
        run: >-
          flutter build apk --release
          --target-platform android-arm64
          --obfuscate --split-debug-info=build/symbols

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: transcendence-apk
          path: build/app/outputs/flutter-apk/app-release.apk
