# Backend CI — lint, test, migration check, security check (brief §10).
# Terpisah dari main.yml (build APK, tujuan tidak diubah).
name: Backend CI

on:
  push:
    branches: [main]
    paths: ['backend/**', '.github/workflows/backend-tests.yml']
  pull_request:
    paths: ['backend/**', '.github/workflows/backend-tests.yml']
  workflow_dispatch:

defaults:
  run:
    working-directory: backend

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history — step "Bukti kalkulator lot tidak berubah"
          # menjalankan `git diff --exit-code <base.sha>`; checkout
          # shallow (depth 1) membuat objek base.sha tidak ada
          # ("fatal: bad object") sehingga step melapor pelanggaran palsu
          # padahal checksum protected files identik.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          pip install flask psycopg2-binary cryptography pytest pgserver pyyaml \
            python-dotenv waitress rpyc

      - name: Compile check (lint sintaks)
        run: python -m compileall -q . && echo "compile OK"

      - name: Security check — tidak ada pemanggilan MT5 tulis (read-only)
        run: python -m pytest tests/test_readonly_static.py -v

      - name: Test penuh (SQLite mock) — regresi + multi-customer
        run: python -m pytest tests/ --ignore=tests/test_postgres_migration.py -v

      - name: Migrasi PostgreSQL dari DB kosong + E2E PG
        run: python -m pytest tests/test_postgres_migration.py -v

      - name: Bukti kalkulator lot tidak berubah (checksum)
        run: |
          sha256sum ../lib/engine.dart ../legacy-web/script.js \
            ../lib/montecarlo.dart ../lib/main.dart
          git diff --exit-code ${{ github.event.pull_request.base.sha || 'HEAD~20' }} -- \
            ../lib/engine.dart ../legacy-web/script.js ../lib/montecarlo.dart ../lib/main.dart \
            && echo "PROTECTED FILES IDENTIK" || (echo "PELANGGARAN: file kalkulator berubah!" && exit 1)
