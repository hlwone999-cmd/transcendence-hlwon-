# Deployment backend — HANYA dengan approval manual (brief §10).
# Urutan wajib: catat commit lama -> backup DB -> deploy kode -> migrasi
# -> health check -> rollback bila gagal (kode KE commit ter-deploy
# sebelumnya + database KE dump pra-deploy = pasangan versi kompatibel).
#
# Perbaikan audit round-2 #2:
#   1. `environment: production` pindah dari level workflow ke JOB deploy
#      — GitHub Environment protection rules (required reviewer) hanya
#      dievaluasi pada job yang mendeklarasikan environment; di level
#      workflow approval TIDAK valid.
#   2. ENV_FILE disatukan dengan dokumentasi systemd:
#      EnvironmentFile=/opt/transcendence-hlwon-/backend/.env
#      (docs/MULTI-CUSTOMER-INSTALASI-PROVISIONING.md §7) — bukan lagi
#      /etc/default/transcendence-backend. Satu file konfigurasi saja.
#   3. Rollback TIDAK lagi `git reset --hard origin/main`: commit yang
#      TER-DEPLOY sebelumnya dicatat di $BACKUP_DIR/PREVIOUS_COMMIT
#      sebelum deploy, dan rollback mengembalikan kode ke commit itu
#      DIPASANGKAN dengan dump database pra-deploy (dump diambil SEBELUM
#      migrasi kode baru, sehingga skema DB cocok dengan kode lama —
#      pasangan versi yang kompatibel, bukan main yang belum tentu
#      punya migrasi PostgreSQL).
#   4. Langkah normalisasi .env di awal deploy: bila deploy sebelumnya
#      rollback ke database restore, .env dikembalikan ke $DB_NAME
#      sebelum kode baru dinyalakan.
#
# Tidak ada kredensial di repo: semua via GitHub Environment secrets.
# Workflow ini workflow_dispatch SAJA — tidak pernah dipicu push/PR —
# dan TIDAK dijalankan oleh pipeline apa pun (perbaikan TIDAK menjalankan
# deployment ini; hanya admin dengan approval yang boleh).
name: Backend Deploy

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Ketik DEPLOY untuk konfirmasi'
        required: true
        default: ''

env:
  APP_DIR: /opt/transcendence-hlwon-
  VENV_DIR: /opt/transcendence-hlwon-/backend/.venv
  SERVICE: transcendence-backend
  # SATU sumber konfigurasi: sama persis dengan EnvironmentFile pada
  # unit systemd (docs/MULTI-CUSTOMER-INSTALASI-PROVISIONING.md §7).
  ENV_FILE: /opt/transcendence-hlwon-/backend/.env
  BACKUP_DIR: /var/backups/transcendence
  DB_NAME: transcendence
  RESTORE_DB_NAME: transcendence_restore
  HEALTH_URL: http://127.0.0.1:8000/api/v1/health

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: Konfirmasi manual
        run: |
          if [ "${{ github.event.inputs.confirm }}" != "DEPLOY" ]; then
            echo "Ketik DEPLOY pada input confirm untuk melanjutkan."; exit 1;
          fi

  deploy:
    needs: guard
    runs-on: ubuntu-latest
    # environment di JOB (bukan workflow): required reviewer GitHub
    # Environment dievaluasi di sini — approval valid sebelum deploy.
    environment:
      name: production
      url: https://jurnal.domain.com
    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      - name: Catat commit ter-deploy sebelumnya (target rollback)
        run: |
          PREV=$(ssh deploy@${{ secrets.VPS_HOST }} \
            "cd $APP_DIR 2>/dev/null && git rev-parse HEAD 2>/dev/null || true")
          if [ -z "$PREV" ]; then
            echo "::warning::Tidak ada commit ter-deploy sebelumnya (deploy pertama?) — rollback kode tidak memilih commit lama, hanya DB restore."
            PREV="NONE"
          fi
          ssh deploy@${{ secrets.VPS_HOST }} "
            sudo mkdir -p $BACKUP_DIR
            echo '$PREV' | sudo tee $BACKUP_DIR/PREVIOUS_COMMIT >/dev/null
            sudo chmod 600 $BACKUP_DIR/PREVIOUS_COMMIT"
          echo "PREV_COMMIT=$PREV" >> "$GITHUB_ENV"
          echo "Commit ter-deploy sebelumnya: $PREV"

      - name: Backup database sebelum migration (pg_dump)
        run: |
          ssh deploy@${{ secrets.VPS_HOST }} "
            set -e
            sudo mkdir -p $BACKUP_DIR
            STAMP=\$(date +%Y%m%d-%H%M%S)
            sudo -u postgres pg_dump $DB_NAME | gzip > \
              $BACKUP_DIR/pre-deploy-\$STAMP.sql.gz
            # simpan nama backup terakhir agar rollback memakai file yang PASTI benar
            echo \$STAMP | sudo tee $BACKUP_DIR/LAST_PRE_DEPLOY >/dev/null
            sudo chmod 600 $BACKUP_DIR/pre-deploy-\$STAMP.sql.gz
            ls -1t $BACKUP_DIR/pre-deploy-*.sql.gz | head -3"

      - name: Normalisasi .env ke database utama (bekas rollback)
        run: |
          # Bila deploy sebelumnya gagal dan service sempat diarahkan ke
          # ${RESTORE_DB_NAME}, kembalikan DATABASE_URL ke $DB_NAME agar
          # kode baru tidak jalan di atas database restore lama.
          ssh deploy@${{ secrets.VPS_HOST }} "
            set -e
            if sudo grep -q '/${RESTORE_DB_NAME}' $ENV_FILE; then
              sudo sed -i -E 's#(postgresql://[^/]+)/${RESTORE_DB_NAME}([?[:space:]]|$)#\1/${DB_NAME}\2#' $ENV_FILE
              echo '.env dinormalisasi ke database utama'
            else
              echo '.env sudah menunjuk database utama'
            fi"

      - name: Deploy kode + sinkronkan dependensi venv
        run: |
          ssh deploy@${{ secrets.VPS_HOST }} "
            set -e
            cd $APP_DIR
            git fetch origin
            git checkout ${{ github.ref_name }} 2>/dev/null || git checkout main
            git reset --hard origin/\$(git rev-parse --abbrev-ref HEAD)
            source $VENV_DIR/bin/activate
            pip install -r backend/requirements.txt"

      - name: Migrasi PostgreSQL (jalankan sebagai role owner)
        run: |
          ssh deploy@${{ secrets.VPS_HOST }} "
            set -e
            source $VENV_DIR/bin/activate
            cd $APP_DIR/backend
            # Migrasi butuh hak DDL (CREATE TABLE/ROLE): pakai DSN admin
            # dari secret, BUKAN DSN aplikasi (role non-owner transcendence_app).
            export DATABASE_URL='${{ secrets.VPS_DB_ADMIN_URL }}'
            python -c \"import db, config; c=config.load_config(); conn=db.connect_postgres(c.db_url); print('migrasi:', db.migrate(conn)); conn.close()\""

      - name: Restart service + health check
        run: |
          ssh deploy@${{ secrets.VPS_HOST }} "
            set -e
            sudo systemctl restart $SERVICE
            for i in 1 2 3 4 5 6; do
              code=\$(curl -s -o /dev/null -w '%{http_code}' $HEALTH_URL || true)
              [ \"\$code\" = \"200\" ] && echo 'health OK' && exit 0
              echo \"percobaan \$i: HTTP \$code\"; sleep 5
            done
            echo 'health check GAGAL — memicu rollback'
            exit 1"

      - name: Rollback bila deployment gagal (kode commit lama + DB pra-deploy)
        if: failure()
        run: |
          ssh deploy@${{ secrets.VPS_HOST }} "
            set -e
            cd $APP_DIR
            # 1) kode kembali ke commit TER-DEPLOY sebelumnya (bukan main!):
            #    pasangan versi kompatibel dengan dump di langkah 2.
            PREV=\$(sudo cat $BACKUP_DIR/PREVIOUS_COMMIT 2>/dev/null || true)
            if [ -n \"\$PREV\" ] && [ \"\$PREV\" != 'NONE' ]; then
              git fetch origin
              git checkout --detach \"\$PREV\"
              echo \"kode dikembalikan ke commit ter-deploy sebelumnya: \$PREV\"
            else
              echo '::warning::commit ter-deploy sebelumnya tidak tercatat — kode TIDAK dipindah; hanya DB di-restore. Intervensi manual mungkin diperlukan.'
            fi
            source $VENV_DIR/bin/activate
            pip install -r backend/requirements.txt
            # 2) database: dump pra-deploy (skema SEBELUM migrasi kode baru
            #    — cocok dengan kode lama) di-restore ke ${RESTORE_DB_NAME}.
            LATEST=\$(cat $BACKUP_DIR/LAST_PRE_DEPLOY)
            DUMP=$BACKUP_DIR/pre-deploy-\$LATEST.sql.gz
            test -f \"\$DUMP\" || { echo 'dump tidak ditemukan'; exit 1; }
            sudo -u postgres dropdb --if-exists $RESTORE_DB_NAME
            sudo -u postgres createdb $RESTORE_DB_NAME
            gunzip -c \"\$DUMP\" | sudo -u postgres psql -q $RESTORE_DB_NAME
            # 3) service BENAR-BENAR diarahkan ke database restore:
            #    DATABASE_URL di EnvironmentFile systemd diganti nama DB.
            sudo sed -i -E 's#(postgresql://[^/]+)/${DB_NAME}([?[:space:]]|$)#\1/${RESTORE_DB_NAME}\2#' $ENV_FILE
            sudo systemctl restart $SERVICE
            # 4) health check ulang SETELAH service membaca DB restore
            for i in 1 2 3 4 5 6; do
              code=\$(curl -s -o /dev/null -w '%{http_code}' $HEALTH_URL || true)
              [ \"\$code\" = \"200\" ] && echo \"ROLLBACK OK (kode \$PREV + DB $RESTORE_DB_NAME dari \$DUMP)\" && exit 0
              echo \"rollback percobaan \$i: HTTP \$code\"; sleep 5
            done
            echo 'ROLLBACK health check GAGAL — intervensi manual wajib'; exit 1"
