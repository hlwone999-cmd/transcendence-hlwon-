# Deployment backend — HANYA dengan approval manual (brief §10).
# Urutan wajib: catat commit lama -> backup DB -> deploy kode -> migrasi
# -> health check -> rollback bila gagal (kode KE commit ter-deploy
# sebelumnya + database KE dump pra-deploy = pasangan versi kompatibel).
#
# Perbaikan audit round-2 #2:
#   1. `environment: production` di JOB deploy (bukan level workflow) —
#      required reviewer GitHub Environment dievaluasi per job.
#   2. ENV_FILE disatukan dengan dokumentasi systemd:
#      EnvironmentFile=/opt/transcendence-hlwon-/backend/.env
#      (docs/MULTI-CUSTOMER-INSTALASI-PROVISIONING.md §7).
#   3. Rollback TIDAK `git reset --hard origin/main`: kode kembali ke
#      PREVIOUS_COMMIT (commit ter-deploy sebelumnya) DIPASANGKAN dengan
#      dump database pra-deploy — pasangan versi yang kompatibel.
#
# Perbaikan audit round-3 (temuan deployment):
#   1. BACKUP PERMISSION (temuan #1): /var/backups/transcendence dibuat
#      dengan `install -d -o deploy -g deploy -m 750` — MILIK user
#      deploy, bukan root-owned dari `sudo mkdir`. Penulisan dump
#      (`gzip > $BACKUP_DIR/...`), PREVIOUS_COMMIT, APPROVED_COMMIT dan
#      LAST_PRE_DEPLOY berjalan sebagai user deploy TANPA sudo (dengan
#      umask 077 + chmod 600). Idempoten: bila owner/mode berubah,
#      `install -d` mengembalikannya sebelum penulisan.
#   2. DEPLOY IMMUTABLE COMMIT (temuan #2): deploy memakai SHA EKSPLISIT
#      ($DEPLOY_SHA) yang divalidasi guard: ref pemicu wajib 'main',
#      SHA wajib full 40-hex DAN bagian dari sejarah main. Kode di VPS
#      di-checkout --detach pada SHA itu — TIDAK PERNAH reset ke
#      origin/<branch> yang bisa berubah setelah approval. SHA juga
#      dicatat ke $BACKUP_DIR/APPROVED_COMMIT sebagai jejak audit.
#   3. FIRST-DEPLOY ROLLBACK (temuan #3): logika rollback dipindah ke
#      backend/deploy/rollback.sh (dites pytest dengan stub — lihat
#      tests/test_rollback_script.py). Bila PREVIOUS_COMMIT=NONE:
#      TIDAK ada restore-lalu-biarkan-kode-baru-jalan — service
#      DIHENTIKAN, database utama dikembalikan ke kondisi pra-deploy,
#      .env tidak diubah, retry first-deploy secara manual. Gate juga
#      menghentikan deploy SEBELUM migrasi bila "first deploy" tetapi
#      database sudah berisi skema (status tidak konsisten).
#   4. HEALTH CHECK (temuan #4): /api/v1/health sekarang readiness —
#      200 hanya bila koneksi PostgreSQL hidup DAN tabel inti ada;
#      status terminal MT5 dilaporkan terpisah dan tidak dipersyaratkan.
#
# Tidak ada kredensial di repo: semua via GitHub Environment secrets.
# Workflow ini workflow_dispatch SAJA — tidak pernah dipicu push/PR —
# dan TIDAK dijalankan oleh pipeline apa pun (perbaikan TIDAK menjalankan
# deployment ini; hanya admin dengan approval yang boleh).
name: Backend Deploy

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Ketik DEPLOY untuk konfirmasi'
        required: true
        default: ''
      deploy_sha:
        description: >-
          Full 40-hex SHA commit produksi yang di-approve
          (kosong = SHA run ini pada main)
        required: false
        default: ''

env:
  APP_DIR: /opt/transcendence-hlwon-
  VENV_DIR: /opt/transcendence-hlwon-/backend/.venv
  SERVICE: transcendence-backend
  # SATU sumber konfigurasi: sama persis dengan EnvironmentFile pada
  # unit systemd (docs/MULTI-CUSTOMER-INSTALASI-PROVISIONING.md §7).
  ENV_FILE: /opt/transcendence-hlwon-/backend/.env
  BACKUP_DIR: /var/backups/transcendence
  # Pemilik direktori backup = user SSH deploy (audit round-3 #1).
  BACKUP_OWNER: deploy
  DB_NAME: transcendence
  RESTORE_DB_NAME: transcendence_restore
  HEALTH_URL: http://127.0.0.1:8000/api/v1/health
  # Aturan produksi (audit round-3 #2): hanya commit di sejarah branch ini.
  PROD_BRANCH: main

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: Konfirmasi manual
        run: |
          if [ "${{ github.event.inputs.confirm }}" != "DEPLOY" ]; then
            echo "Ketik DEPLOY pada input confirm untuk melanjutkan."; exit 1;
          fi

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Aturan produksi — ref + commit eksplisit (audit round-3 #2)
        run: |
          set -e
          # (1) Produksi hanya dari branch terlindungi — aturan jelas.
          if [ "${{ github.ref_name }}" != "$PROD_BRANCH" ]; then
            echo "::error::Deploy produksi hanya diizinkan dari ref '$PROD_BRANCH' (run ini dipicu dari: ${{ github.ref_name }})"
            exit 1
          fi
          # (2) Commit yang di-deploy = SHA EKSPLISIT yang dilihat (dan
          #     di-approve) reviewer pada run ini — BUKAN origin/<branch>
          #     yang bisa bergerak setelah approval.
          SHA="${{ github.event.inputs.deploy_sha }}"
          SHA="${SHA:-${{ github.sha }}}"
          if ! echo "$SHA" | grep -qE '^[0-9a-fA-F]{40}$'; then
            echo "::error::deploy_sha harus full 40-hex SHA commit (diterima: '$SHA')"
            exit 1
          fi
          # (3) SHA wajib bagian dari sejarah branch produksi.
          if ! git merge-base --is-ancestor "$SHA" "origin/$PROD_BRANCH"; then
            echo "::error::SHA $SHA BUKAN bagian sejarah $PROD_BRANCH — produksi hanya menerima commit $PROD_BRANCH"
            exit 1
          fi
          echo "DEPLOY_SHA=$SHA" >> "$GITHUB_ENV"
          echo "Commit produksi terpilih (immutable): $SHA"

  deploy:
    needs: guard
    runs-on: ubuntu-latest
    # environment di JOB (bukan workflow): required reviewer GitHub
    # Environment dievaluasi di sini — approval valid sebelum deploy.
    environment:
      name: production
      url: https://jurnal.domain.com
    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      - name: Catat commit ter-deploy sebelumnya + direktori backup (owner deploy)
        run: |
          PREV=$(ssh deploy@${{ secrets.VPS_HOST }} \
            "cd $APP_DIR 2>/dev/null && git rev-parse HEAD 2>/dev/null || true")
          if [ -z "$PREV" ]; then
            echo "::warning::Tidak ada commit ter-deploy sebelumnya (FIRST DEPLOY) — bila deploy gagal, rollback menghentikan service + memulihkan DB pra-deploy (rollback.sh); retry manual."
            PREV="NONE"
          fi
          ssh deploy@${{ secrets.VPS_HOST }} "
            set -e
            # AUDIT ROUND-3 #1: direktori backup MILIK user deploy
            # (750). `sudo install -d` idempoten — bila owner/mode
            # menyimpang, dikembalikan di sini SEBELUM penulisan apa
            # pun. Tidak ada lagi direktori root-owned yang membuat
            # `gzip > $BACKUP_DIR/...` (sebagai deploy) gagal.
            sudo install -d -o $BACKUP_OWNER -g $BACKUP_OWNER -m 750 $BACKUP_DIR
            echo '$PREV' > $BACKUP_DIR/PREVIOUS_COMMIT
            chmod 600 $BACKUP_DIR/PREVIOUS_COMMIT
            # AUDIT ROUND-3 #2: jejak commit yang di-approve untuk run ini.
            echo '$DEPLOY_SHA' > $BACKUP_DIR/APPROVED_COMMIT
            chmod 600 $BACKUP_DIR/APPROVED_COMMIT"
          echo "PREV_COMMIT=$PREV" >> "$GITHUB_ENV"
          echo "Commit ter-deploy sebelumnya: $PREV"

      - name: Backup database sebelum migration (pg_dump)
        run: |
          ssh deploy@${{ secrets.VPS_HOST }} "
            set -e
            umask 077
            # idempoten: pastikan kembali owner deploy + mode 750
            sudo install -d -o $BACKUP_OWNER -g $BACKUP_OWNER -m 750 $BACKUP_DIR
            STAMP=\$(date +%Y%m%d-%H%M%S)
            # pg_dump via stdout; penulisan file oleh user deploy pada
            # direktori miliknya sendiri — tanpa sudo, tanpa tee.
            sudo -u postgres pg_dump $DB_NAME | gzip > \
              $BACKUP_DIR/pre-deploy-\$STAMP.sql.gz
            chmod 600 $BACKUP_DIR/pre-deploy-\$STAMP.sql.gz
            # simpan nama backup terakhir agar rollback memakai file
            # yang PASTI benar (file milik deploy — tanpa sudo tee)
            echo \$STAMP > $BACKUP_DIR/LAST_PRE_DEPLOY
            chmod 600 $BACKUP_DIR/LAST_PRE_DEPLOY
            ls -1t $BACKUP_DIR/pre-deploy-*.sql.gz | head -3"

      - name: Normalisasi .env ke database utama (bekas rollback)
        run: |
          # Bila deploy sebelumnya gagal dan service sempat diarahkan ke
          # ${RESTORE_DB_NAME}, kembalikan DATABASE_URL ke $DB_NAME agar
          # kode baru tidak jalan di atas database restore lama.
          ssh deploy@${{ secrets.VPS_HOST }} "
            set -e
            if sudo grep -q '/${RESTORE_DB_NAME}' $ENV_FILE; then
              sudo sed -i -E 's#(postgresql://[^/]+)/${RESTORE_DB_NAME}([?[:space:]]|$)#\1/${DB_NAME}\2#' $ENV_FILE
              echo '.env dinormalisasi ke database utama'
            else
              echo '.env sudah menunjuk database utama'
            fi"

      - name: Deploy kode pada commit yang di-approve (SHA eksplisit)
        run: |
          ssh deploy@${{ secrets.VPS_HOST }} "
            set -e
            cd $APP_DIR
            git fetch origin
            # AUDIT ROUND-3 #2: checkout --detach pada SHA yang sudah
            # divalidasi guard — TIDAK ada `git reset --hard origin/...`
            # yang bisa berubah setelah approval.
            if ! git cat-file -e '$DEPLOY_SHA^{commit}' 2>/dev/null; then
              echo '::error::SHA $DEPLOY_SHA tidak tersedia di remote — sinkronisasi repo VPS'
              exit 1
            fi
            git checkout --detach '$DEPLOY_SHA'
            git rev-parse HEAD
            source $VENV_DIR/bin/activate
            pip install -r backend/requirements.txt"

      - name: Gate first-deploy — tolak bila database sudah berisi skema
        run: |
          # AUDIT ROUND-3 #3: "first deploy" pada database yang SUDAH
          # ada isinya = status tidak konsisten (deploy manual lama
          # tanpa catatan commit?). Hentikan SEBELUM perubahan apa pun;
          # selaraskan catatan commit dulu atau kosongkan DB secara
          # sadar (runbook provisioning §10).
          if [ "$PREV_COMMIT" = "NONE" ]; then
            ssh deploy@${{ secrets.VPS_HOST }} "
              N=\$(sudo -u postgres psql -d $DB_NAME -tAc \
                \"SELECT count(*) FROM pg_tables WHERE schemaname='public' AND tablename='customers'\" 2>/dev/null || echo 0)
              if [ \"\$N\" != '0' ]; then
                echo '::error::FIRST DEPLOY tetapi database $DB_NAME sudah berisi skema — hentikan sebelum perubahan; selaraskan $BACKUP_DIR/PREVIOUS_COMMIT atau kosongkan DB secara sadar (runbook §10)'
                exit 1
              fi
              echo 'first deploy pada database kosong — aman untuk migrasi'"
          else
            echo "bukan first deploy (sebelumnya: $PREV_COMMIT) — gate dilewati"
          fi

      - name: Migrasi PostgreSQL (jalankan sebagai role owner)
        run: |
          ssh deploy@${{ secrets.VPS_HOST }} "
            set -e
            source $VENV_DIR/bin/activate
            cd $APP_DIR/backend
            # Migrasi butuh hak DDL (CREATE TABLE/ROLE): pakai DSN admin
            # dari secret, BUKAN DSN aplikasi (role non-owner transcendence_app).
            export DATABASE_URL='${{ secrets.VPS_DB_ADMIN_URL }}'
            python -c \"import db, config; c=config.load_config(); conn=db.connect_postgres(c.db_url); print('migrasi:', db.migrate(conn)); conn.close()\""

      - name: Restart service + health check (readiness DB + skema)
        run: |
          ssh deploy@${{ secrets.VPS_HOST }} "
            set -e
            sudo systemctl restart $SERVICE
            for i in 1 2 3 4 5 6; do
              code=\$(curl -s -o /dev/null -w '%{http_code}' $HEALTH_URL || true)
              [ \"\$code\" = \"200\" ] && echo 'health OK (DB + skema siap)' && exit 0
              echo \"percobaan \$i: HTTP \$code\"; sleep 5
            done
            echo 'health check GAGAL — memicu rollback'
            exit 1"

      - name: Rollback bila deployment gagal (kode lama + DB pra-deploy)
        if: failure()
        run: |
          # AUDIT ROUND-3 #3: logika rollback dalam backend/deploy/
          # rollback.sh (dites pytest — tests/test_rollback_script.py),
          # dikirim ke VPS via stdin + parameter env eksplisit.
          ssh deploy@${{ secrets.VPS_HOST }} "
            set -e
            APP_DIR='$APP_DIR' VENV_DIR='$VENV_DIR' SERVICE='$SERVICE' \
            ENV_FILE='$ENV_FILE' BACKUP_DIR='$BACKUP_DIR' DB_NAME='$DB_NAME' \
            RESTORE_DB_NAME='$RESTORE_DB_NAME' HEALTH_URL='$HEALTH_URL' \
            bash -s" < backend/deploy/rollback.sh
