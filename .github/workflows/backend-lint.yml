# Lint & guard CI backend — perbaikan audit round-2 #2.
#
# Workflow ini TIDAK menjalankan deployment apa pun. Isinya:
#   1. Ruff (subset fatal: kesalahan sintaks & nama tak terdefinisi).
#   2. Validasi YAML semua file workflow (.github/workflows/*.yml).
#   3. Guard kebijakan deploy (hasil audit round-2):
#        - backend-deploy.yml hanya workflow_dispatch (tidak pernah
#          dipicu push/PR/schedule — tidak ada deploy otomatis);
#        - `environment: production` WAJIB di job deploy, BUKAN di
#          level workflow (agar GitHub Environment approval valid);
#        - ENV_FILE workflow = EnvironmentFile systemd
#          (/opt/transcendence-hlwon-/backend/.env) — satu sumber config;
#        - rollback memakai PREVIOUS_COMMIT (commit ter-deploy
#          sebelumnya), bukan reset ke origin/main.
#   4. Tripwire file kalkulator (checksum baseline fbf844f): lib/engine.dart,
#      lib/montecarlo.dart, lib/main.dart, legacy-web/script.js — bila
#      satu byte pun berubah, lint GAGAL.
#
# Test penuh berada di Backend CI (backend-tests.yml); main.yml (build
# APK) tidak diubah tujuannya.
name: Backend Lint

on:
  push:
    branches: [main]
    paths: ['backend/**', '.github/workflows/**']
  pull_request:
    paths: ['backend/**', '.github/workflows/**']
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install lint tools
        run: pip install ruff pyyaml

      - name: Ruff — kesalahan fatal saja (sintaks/undefined names)
        run: ruff check backend --select E9,F63,F7,F82 --no-cache

      - name: Validasi YAML semua workflow
        run: |
          python - <<'PY'
          import glob, sys
          import yaml
          ok = True
          for f in sorted(glob.glob(".github/workflows/*.yml")):
              try:
                  with open(f, encoding="utf-8") as fh:
                      yaml.safe_load(fh)
                  print(f"OK   {f}")
              except Exception as e:
                  ok = False
                  print(f"GAGAL {f}: {e}")
          sys.exit(0 if ok else 1)
          PY

      - name: Guard kebijakan deploy (audit round-2 + round-3)
        run: |
          python - <<'PY'
          import re
          import sys
          from pathlib import Path
          import yaml

          with open(".github/workflows/backend-deploy.yml",
                    encoding="utf-8") as fh:
              wf = yaml.safe_load(fh)

          err = []

          trig = wf.get(True) or wf.get("on") or {}
          # YAML 1.1 mem-parse "on" sebagai boolean True — terima keduanya
          if set(trig) != {"workflow_dispatch"}:
              err.append(f"pemicu deploy harus workflow_dispatch SAJA, ada: {sorted(map(str, trig))}")

          if "environment" in wf:
              err.append("environment TIDAK boleh di level workflow "
                         "(GitHub Environment approval tidak valid) — "
                         "pindahkan ke job deploy")

          dep = wf.get("jobs", {}).get("deploy", {})
          if dep.get("environment", {}).get("name") != "production":
              err.append("jobs.deploy.environment.name harus 'production'")

          envs = wf.get("env", {})
          if envs.get("ENV_FILE") != "/opt/transcendence-hlwon-/backend/.env":
              err.append("ENV_FILE harus /opt/transcendence-hlwon-/backend/.env "
                         "(sama dengan EnvironmentFile systemd)")
          if envs.get("APP_DIR") != "/opt/transcendence-hlwon-":
              err.append("APP_DIR harus path VPS aktual /opt/transcendence-hlwon-")

          raw = Path(".github/workflows/backend-deploy.yml").read_text(
              encoding="utf-8")

          # ---- audit round-3 #2: commit produksi EKSPLISIT ------------
          inputs = (trig.get("workflow_dispatch") or {}).get("inputs") or {}
          if "deploy_sha" not in inputs:
              err.append("workflow_dispatch wajib punya input deploy_sha "
                         "(SHA eksplisit yang di-approve)")
          guard_job = wf.get("jobs", {}).get("guard", {})
          guard_raw = str(guard_job.get("steps", []))
          if "merge-base --is-ancestor" not in raw:
              err.append("guard wajib memvalidasi SHA bagian sejarah "
                         "branch produksi (git merge-base --is-ancestor)")
          if "PROD_BRANCH" not in envs:
              err.append("env PROD_BRANCH wajib ada — aturan jelas ref "
                         "produksi yang diizinkan")
          # deploy kode: checkout --detach pada SHA, bukan origin/<branch>
          if "git checkout --detach" not in raw:
              err.append("deploy wajib git checkout --detach pada SHA "
                         "eksplisit")
          cmd_lines = [ln for ln in raw.splitlines()
                       if ln.lstrip().startswith(("git ", "- git "))]
          if any(re.search(r"reset --hard origin/", ln)
                 for ln in cmd_lines):
              err.append("deploy/rollback tidak boleh git reset --hard "
                         "origin/<apa pun> — hanya SHA eksplisit")
          if "APPROVED_COMMIT" not in raw:
              err.append("SHA ter-approve wajib dicatat ke "
                         "$BACKUP_DIR/APPROVED_COMMIT (jejak audit)")

          # ---- audit round-3 #1: izin direktori backup ----------------
          if "install -d -o" not in raw or "750" not in raw:
              err.append("direktori backup wajib dibuat via "
                         "install -d -o deploy -g deploy -m 750 "
                         "(bukan sudo mkdir root-owned)")
          if re.search(r"sudo\s+mkdir\s+-p\s+\$BACKUP_DIR", raw):
              err.append("sudo mkdir -p $BACKUP_DIR (root-owned) "
                         "dilarang — pakai install -d -o deploy")
          if re.search(r"sudo tee \$BACKUP_DIR", raw):
              err.append("penulisan file backup via sudo tee dilarang — "
                         "direktori milik deploy, tulis langsung")

          # ---- audit round-3 #3: rollback script ----------------------
          rb = Path("backend/deploy/rollback.sh")
          if not rb.is_file():
              err.append("backend/deploy/rollback.sh wajib ada "
                         "(logika rollback dites pytest)")
          else:
              rb_raw = rb.read_text(encoding="utf-8")
              for needle in ("PREVIOUS_COMMIT", "systemctl stop",
                             "FIRST-DEPLOY"):
                  if needle not in rb_raw:
                      err.append(f"rollback.sh wajib mengandung '{needle}'")
              if "LAST_PRE_DEPLOY" not in raw or \
                      "rollback.sh" not in raw:
                  err.append("workflow wajib memanggil backend/deploy/"
                             "rollback.sh dengan env eksplisit")
          # larangan round-2 tetap: rollback memakai PREVIOUS_COMMIT
          if "PREVIOUS_COMMIT" not in raw:
              err.append("rollback wajib memakai PREVIOUS_COMMIT "
                         "(commit ter-deploy sebelumnya), bukan origin/main")
          if any("reset --hard origin/main" in ln for ln in cmd_lines):
              err.append("rollback tidak boleh git reset --hard origin/main")

          # ---- audit round-3 #4: health readiness ---------------------
          routes = Path("backend/api/routes.py").read_text(
              encoding="utf-8")
          if "503" not in routes or "missing_tables" not in routes:
              err.append("/api/v1/health wajib readiness: 503 bila DB/"
                         "skema minimum tidak siap (lihat CORE_TABLES)")

          with open(".github/workflows/main.yml", encoding="utf-8") as fh:
              main_raw = fh.read()
          if len(main_raw.strip()) < 50:
              err.append("main.yml (build APK) harus tetap ada dan utuh")

          for e in err:
              print("PELANGGARAN:", e)
          sys.exit(1 if err else 0)
          PY
          echo "guard kebijakan deploy OK (round-2 + round-3)"

      - name: Tripwire file kalkulator (checksum baseline)
        run: |
          EXPECTED="d04cfd730f9709fc4a0b9fb78f3e6c363277cca5da4b8eaa5240b2c7bbc10bf2  lib/engine.dart
          abd8edadf1716d7f1701f5eccf47a9839192e9e33fd2f1465192ca13e0ea801d  lib/montecarlo.dart
          f25edffb25788902e604a04a7fa649bc37c15dfaa0fb792b9c55ad834e97be0b  lib/main.dart
          8d553d78fec7094fd63f71f548fe2e04a80cac23eb4ac65323e4fbdcd2f39e5f  legacy-web/script.js"
          ACTUAL=$(sha256sum lib/engine.dart lib/montecarlo.dart lib/main.dart legacy-web/script.js)
          # bandingkan per baris (normalisasi indentasi EXPECTED)
          DIFF=$(diff <(echo "$EXPECTED" | sed 's/^ *//') <(echo "$ACTUAL") || true)
          if [ -n "$DIFF" ]; then
            echo "PELANGGARAN: file kalkulator berubah (protected files)!"
            echo "$DIFF"
            exit 1
          fi
          echo "PROTECTED FILES IDENTIK (baseline fbf844f)"
